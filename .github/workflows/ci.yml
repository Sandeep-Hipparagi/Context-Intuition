# VibeCore CI Pipeline
# Author: Sandeep Hipparagi (https://github.com/Sandeep-Hipparagi)

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  VIBECORE_MOCK_LLM: "1"
  VIBECORE_OLLAMA_URL: "http://127.0.0.1:11434/api/chat"
  VIBECORE_FAST_MODEL: "qwen2.5:1.5b"
  VIBECORE_REASONING_MODEL: "llama3.1:8b"

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run type checking
        run: |
          mypy core-orchestrator/app policy-enclave mcp-tools

      - name: Run linting
        run: |
          ruff check core-orchestrator/app policy-enclave mcp-tools tests

      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short

  chrome-extension-build:
    name: Chrome Extension Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: chrome-extension/package-lock.json

      - name: Install dependencies
        working-directory: ./chrome-extension
        run: npm ci

      - name: TypeScript type check
        working-directory: ./chrome-extension
        run: npm run type-check

      - name: Build extension
        working-directory: ./chrome-extension
        run: npm run build

      - name: Verify dist output
        working-directory: ./chrome-extension
        run: |
          test -f dist/service_worker.js
          test -f dist/content_script.js
          test -f dist/popup.js
          test -f dist/popup.html
          test -f dist/popup.css
          test -f dist/manifest.json

  dashboard-ui-build:
    name: Dashboard UI Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: dashboard-ui/package-lock.json

      - name: Install dependencies
        working-directory: ./dashboard-ui
        run: npm ci

      - name: Build dashboard
        working-directory: ./dashboard-ui
        run: npm run build

      - name: Verify dist output
        working-directory: ./dashboard-ui
        run: |
          test -f dist/index.html
          test -d dist/assets

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies and security tools
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/python -m pip install --upgrade pip setuptools
          /tmp/audit-venv/bin/pip install -e . bandit pip-audit

      - name: Run bandit security linter
        run: |
          /tmp/audit-venv/bin/bandit -r core-orchestrator/app policy-enclave mcp-tools -f screen

      - name: Run pip-audit vulnerability scan
        run: |
          /tmp/audit-venv/bin/pip-audit --desc

  hardcoded-secrets-scan:
    name: Hardcoded Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan for hardcoded secrets
        run: |
          python3 - <<'EOF'
          import re
          import sys
          from pathlib import Path

          exclude_dirs = {
              ".git",
              ".github",
              ".mypy_cache",
              ".pytest_temp",
              ".ruff_cache",
              ".venv",
              "__pycache__",
              "context_intuition.egg-info",
              "dist",
              "node_modules",
              "tests",
              "venv",
          }
          scan_exts = {".py", ".ts", ".tsx", ".js", ".mjs", ".json", ".yaml", ".yml", ".sh", ".ps1"}
          token_re = re.compile(
              r"(?:sk_live_[A-Za-z0-9_]+|sk_test_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+"
              r"|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16}"
              r"|-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----)"
          )
          cred_re = re.compile(
              r"""(?:api_key|api_secret|secret_key|password|access_token|client_secret|bearer_token)\s*[:=]\s*["']([^"']{4,})["']""",
              re.IGNORECASE,
          )
          placeholder_re = re.compile(
              r"^(?:placeholder|changeme|your[_-][A-Za-z0-9_-]+|<[^>]+>|\.\.\.|\*+)$",
              re.IGNORECASE,
          )

          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in exclude_dirs for part in path.parts):
                  continue
              if path.name.startswith("test_") or path.name == "package-lock.json":
                  continue
              if path.suffix not in scan_exts and not path.name.startswith(".env"):
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              for lineno, line in enumerate(text.splitlines(), start=1):
                  if token_re.search(line):
                      hits.append(f"::error file={path},line={lineno}::Potential hardcoded token detected")
                  else:
                      m = cred_re.search(line)
                      if m and not placeholder_re.search(m.group(1)):
                          hits.append(f"::error file={path},line={lineno}::Potential hardcoded credential literal detected")

          if hits:
              print("\n".join(hits))
              sys.exit(1)
          print("No hardcoded secrets detected")
          EOF

  hardcoded-paths-scan:
    name: Hardcoded Paths Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan for hardcoded absolute paths
        run: |
          python3 - <<'EOF'
          import re
          import sys
          from pathlib import Path

          scan_roots = [
              Path("core-orchestrator"),
              Path("policy-enclave"),
              Path("mcp-tools"),
              Path("chrome-extension/src"),
              Path("dashboard-ui/src"),
              Path("scripts"),
          ]
          exclude_dirs = {
              ".git",
              ".mypy_cache",
              ".pytest_temp",
              ".ruff_cache",
              ".venv",
              "__pycache__",
              "context_intuition.egg-info",
              "dist",
              "node_modules",
              "tests",
              "venv",
          }
          scan_exts = {".py", ".ts", ".tsx", ".js", ".sh", ".ps1"}
          path_re = re.compile(
              r"(?:/home/[A-Za-z0-9._-]+|/Users/[A-Za-z0-9._-]+|[A-Za-z]:(?:\\+|/)(?:Users|home|Program Files|[A-Za-z0-9._-]{2,})(?:\\|/))"
          )

          hits = []
          for root in scan_roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in scan_exts:
                      continue
                  if any(part in exclude_dirs for part in path.parts) or path.name.startswith("test_"):
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for lineno, line in enumerate(text.splitlines(), start=1):
                      if path_re.search(line):
                          hits.append(f"::error file={path},line={lineno}::Hardcoded absolute path detected")

          if hits:
              print("\n".join(hits))
              sys.exit(1)
          print("No hardcoded absolute paths detected")
          EOF

  full-verification:
    name: Full Verification Gate
    needs: [python-tests, chrome-extension-build, dashboard-ui-build, security-scan, hardcoded-secrets-scan, hardcoded-paths-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.python-tests.result }}" != "success" ]; then echo "Python tests failed"; exit 1; fi
          if [ "${{ needs.chrome-extension-build.result }}" != "success" ]; then echo "Chrome extension build failed"; exit 1; fi
          if [ "${{ needs.dashboard-ui-build.result }}" != "success" ]; then echo "Dashboard UI build failed"; exit 1; fi
          if [ "${{ needs.security-scan.result }}" != "success" ]; then echo "Security scan failed"; exit 1; fi
          if [ "${{ needs.hardcoded-secrets-scan.result }}" != "success" ]; then echo "Secrets scan failed"; exit 1; fi
          if [ "${{ needs.hardcoded-paths-scan.result }}" != "success" ]; then echo "Hardcoded paths scan failed"; exit 1; fi
          echo "All verification gates passed!"
