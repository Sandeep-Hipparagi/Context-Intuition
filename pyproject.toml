[project]
name = "context-intuition"
version = "0.1.0"
description = "VibeCore / Context-Intuition: Longitudinal, Local-First Personal Agent Swarm Runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sandeep Hipparagi" }
]
license = { text = "Apache-2.0" }
keywords = ["agentic-ai", "multi-agent", "local-first", "zero-trust", "privacy", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "websockets>=13.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "rich>=13.8.0",
    "python-dotenv>=1.0.1",
    "croniter>=2.0.0",
    "apscheduler>=3.10.4",
]

[project.urls]
Homepage = "https://github.com/Sandeep-Hipparagi/Context-Intuition"
Repository = "https://github.com/Sandeep-Hipparagi/Context-Intuition"
Documentation = "https://github.com/Sandeep-Hipparagi/Context-Intuition#readme"
Issues = "https://github.com/Sandeep-Hipparagi/Context-Intuition/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0"
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--basetemp=.pytest_temp -q"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
